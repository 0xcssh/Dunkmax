# iOS-only icon generation, for ios-release.yml.
#
# That workflow scaffolds `flutter create --platforms=ios`, so there is no
# android/ directory. Asking for Android icons there fails on a missing
# AndroidManifest.xml — which is exactly how the first icon build broke.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  # iOS rejects an icon with an alpha channel, and it rejects it at upload
  # rather than at build. Flattening here fails loudly instead.
  remove_alpha_ios: true
  android: false
