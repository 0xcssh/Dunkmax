name: Web preview

# Builds the real Flutter app to web and publishes it to GitHub Pages so it
# can be previewed live in a browser (no Mac / device build needed). Updates
# on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize platform scaffolding
        run: |
          flutter create --platforms=web --project-name dunkmax .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      # base-href must match the Pages project path (/<repo>/).
      - name: Build web
        run: flutter build web --release --base-href "/Dunkmax/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
