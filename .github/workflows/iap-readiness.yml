name: IAP readiness

# Read-only: prints every link in the chain an App Review purchase depends on
# (version + submission, subscription states, RevenueCat app / key /
# offering / recent customers). See scripts/iap_readiness.py.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      - name: Check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          RC_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
          RC_SDK_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          export ASC_KEY_P8="$(echo "$ASC_KEY_P8_B64" | base64 -d)"
          python scripts/iap_readiness.py
