name: ASC delete subscriptions

# Deletes never-submitted subscriptions by product id. IRREVERSIBLE — the id
# stays reserved by Apple forever. Dry run by default.
on:
  workflow_dispatch:
    inputs:
      product_ids:
        description: "Comma-separated product ids to delete"
        required: true
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      - name: Delete subscriptions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          PRODUCT_IDS: ${{ inputs.product_ids }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          export ASC_KEY_P8="$(echo "$ASC_KEY_P8_B64" | base64 -d)"
          python scripts/asc_delete_subscriptions.py
