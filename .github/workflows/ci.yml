name: CI

# Cheap analyze+test on every push (Ubuntu); the macOS iOS build is manual
# (workflow_dispatch) to spare macOS-runner minutes — same discipline as
# PodRadar. Generated platform folders are gitignored and regenerated here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Backfill platform folders, then drop the template smoke test it
      # generates (it references the default MyApp we replaced with our own).
      - name: Materialize platform scaffolding
        run: |
          flutter create --platforms=ios,android --project-name dunkmax .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  ios-build:
    name: iOS build (unsigned)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize platform scaffolding
        run: |
          flutter create --platforms=ios,android --project-name dunkmax .
          rm -f test/widget_test.dart

      - name: Raise the iOS deployment floor to 15.5
        # google_mlkit_pose_detection's pods require iOS 15.5. ios/ is
        # gitignored and regenerated by `flutter create` above, whose Podfile
        # leaves the platform line commented out and the project target well
        # below that — so CocoaPods resolves an incompatible platform and
        # `pod install` fails before anything else is even tried. Setting it
        # in both places (Podfile for pod resolution, pbxproj for the app
        # target itself) is what keeps them in agreement.
        run: python3 tool/set_ios_deployment_target.py 15.5

      - name: Add camera/photo library usage descriptions
        # Kept in sync with ios-release.yml's signed build — see that
        # workflow for why these can't just live in the repo.
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Dunk It uses your camera to film your jump for vertical analysis.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Dunk It records video of your jump; iOS camera capture requires microphone access even though we don'\''t use the audio.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Dunk It needs access to your photo library to analyze a previously recorded jump.'" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      # Compile-only validation on the real macOS toolchain. Signing/IPA export
      # is handled by ios-release.yml once signing secrets exist in this repo.
      - name: Generate app icons
        # Must run after `flutter create` (which regenerates ios/ and android/
        # with Flutter's default icon) and after `pub get` (the generator is a
        # dev dependency). Skipped when no source image is present, so the
        # build still succeeds while the icon is being prepared.
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "assets/icon/app_icon.png missing - keeping the default icon"
          fi

      - name: Build iOS (no code signing)
        # Kept in sync with ios-release.yml's deployment target — Apple
        # requires MinimumOSVersion >= 15.0, and google_mlkit_pose_detection
        # needs 15.5 — the higher floor wins.
        env:
          FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: "15.5"
        run: flutter build ios --release --no-codesign
