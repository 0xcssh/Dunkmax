name: CI

# Cheap analyze+test on every push (Ubuntu); the macOS iOS build is manual
# (workflow_dispatch) to spare macOS-runner minutes — same discipline as
# PodRadar. Generated platform folders are gitignored and regenerated here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Backfill platform folders, then drop the template smoke test it
      # generates (it references the default MyApp we replaced with our own).
      - name: Materialize platform scaffolding
        run: |
          flutter create --platforms=ios,android --project-name dunkmax .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  ios-build:
    name: iOS build (unsigned)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize platform scaffolding
        run: |
          flutter create --platforms=ios,android --project-name dunkmax .
          rm -f test/widget_test.dart

      - name: Add camera/photo library usage descriptions
        # Kept in sync with ios-release.yml's signed build — see that
        # workflow for why these can't just live in the repo.
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Dunk It uses your camera to film your jump for vertical analysis.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Dunk It needs access to your photo library to analyze a previously recorded jump.'" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      # Compile-only validation on the real macOS toolchain. Signing/IPA export
      # is handled by ios-release.yml once signing secrets exist in this repo.
      - name: Build iOS (no code signing)
        # Kept in sync with ios-release.yml's deployment target — Apple
        # requires MinimumOSVersion >= 15.0 for App Store Connect uploads.
        env:
          FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: flutter build ios --release --no-codesign
