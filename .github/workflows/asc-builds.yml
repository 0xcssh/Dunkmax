name: ASC builds

# Read-only: lists the latest builds with their processing and TestFlight
# state, to know when a freshly uploaded build is installable.
on:
  workflow_dispatch:

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      - name: List builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          export ASC_KEY_P8="$(echo "$ASC_KEY_P8_B64" | base64 -d)"
          python scripts/asc_builds.py
