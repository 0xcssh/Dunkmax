name: iOS Release

# Signed device builds — manual only (spares shared macOS-runner minutes,
# same discipline as ci.yml's unsigned check). Mirrors PodRadar/RepLock's
# ios.yml signing flow (apple-actions/import-codesign-certs + ASC API key +
# `-allowProvisioningUpdates` for zero-touch provisioning), adapted for a
# Flutter project: `flutter build ios --no-codesign` does the CocoaPods
# install + asset build, then a raw `xcodebuild archive` on the resulting
# .xcworkspace handles signing/export, since `flutter build ipa` doesn't
# expose the `-allowProvisioningUpdates`/API-key flags this flow needs.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA export method (debugging = dev-signed for USB sideload)"
        type: choice
        options: [debugging, app-store-connect]
        default: debugging

jobs:
  device-build:
    name: Signed device build (IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # App Store validation requires the iOS 26 SDK (Xcode 26+) — the
          # runner's default Xcode is older, so this must be explicit, like
          # RepLock/PodRadar's ios.yml.
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize platform scaffolding
        run: |
          flutter create --platforms=ios --org com.awdia --project-name dunkmax .
          rm -f test/widget_test.dart

      - name: Raise the iOS deployment floor to 15.5
        # google_mlkit_pose_detection's pods require iOS 15.5. ios/ is
        # gitignored and regenerated by `flutter create` above, whose Podfile
        # leaves the platform line commented out and the project target well
        # below that — so CocoaPods resolves an incompatible platform and
        # `pod install` fails before anything else is even tried. Setting it
        # in both places (Podfile for pod resolution, pbxproj for the app
        # target itself) is what keeps them in agreement.
        run: python3 tool/set_ios_deployment_target.py 15.5

      - name: Add camera/photo library usage descriptions + export compliance
        # ios/ is gitignored and regenerated above, so these can't live in the
        # repo — Analyze needs both usage descriptions to record or pick a
        # jump clip; without them iOS kills the app on access instead of
        # prompting. ITSAppUsesNonExemptEncryption declares the app only
        # uses exempt (standard HTTPS) encryption, so App Store Connect
        # doesn't leave each new build's export-compliance flag unset —
        # every build silently needed a manual API patch before this.
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Dunk It uses your camera to film your jump for vertical analysis.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Dunk It records video of your jump; iOS camera capture requires microphone access even though we don'\''t use the audio.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Dunk It needs access to your photo library to analyze a previously recorded jump.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        # Must run after `flutter create` (which regenerates ios/ and android/
        # with Flutter's default icon) and after `pub get` (the generator is a
        # dev dependency). Skipped when no source image is present, so the
        # build still succeeds while the icon is being prepared.
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "assets/icon/app_icon.png missing - keeping the default icon"
          fi

      - name: Build (CocoaPods install + asset compile, unsigned)
        # Apple requires MinimumOSVersion >= 15.0 for App Store Connect
        # uploads (warning today, hard block from spring 2027), and
        # google_mlkit_pose_detection needs 15.5, so 15.5 is the floor.
        # Flutter's default deployment target is lower than both. FLUTTER_XCODE_* env vars are
        # forwarded to xcodebuild as build settings.
        env:
          FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: "15.5"
        # Secrets are threaded in as --dart-define. Every one of them is
        # optional by design: with an empty value the corresponding feature
        # reports itself unavailable rather than failing, which is what keeps
        # ci.yml and web-preview.yml secret-free.
        #
        # PREVIEW_UNLOCK opens the paywall on a build made before RevenueCat
        # exists, so TestFlight can exercise everything that is not the
        # purchase. It is inert once REVENUECAT_API_KEY is set, and removing
        # this line is a submission step in docs/revenuecat-setup.md.
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=REVENUECAT_API_KEY="${{ secrets.REVENUECAT_API_KEY }}" \
            --dart-define=PREVIEW_UNLOCK=true

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          # Both import steps must share the SAME keychain password — the
          # second one unlocks the keychain the first one created.
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Import distribution certificate (TestFlight only)
        if: github.event.inputs.export_method == 'app-store-connect'
        uses: apple-actions/import-codesign-certs@v3
        with:
          create-keychain: false
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.CERT_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode \
            > "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DunkMax.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ vars.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            IPHONEOS_DEPLOYMENT_TARGET="15.5"

      - name: Export IPA
        run: |
          METHOD="${{ github.event.inputs.export_method || 'debugging' }}"
          # app-store-connect + destination upload sends the build straight to
          # TestFlight during the export; debugging keeps a local IPA artifact.
          if [ "$METHOD" = "app-store-connect" ]; then DEST="upload"; else DEST="export"; fi
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>${DEST}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/DunkMax.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload IPA artifact
        if: github.event.inputs.export_method != 'app-store-connect'
        uses: actions/upload-artifact@v4
        with:
          name: DunkMax-ipa
          path: build/export/*.ipa
