name: dunkmax
description: "DunkMax — a vertical jump & dunk training coach."
publish_to: "none"

# Version is Marketing+Build. CI overrides the build number with the run number.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  image: ^4.3.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  # On-device pose detection: tracks the athlete's body landmarks so takeoff
  # and landing come from where the feet actually are, not from whole-frame
  # pixel change (which is scale-invariant and so blind to a subject that
  # occupies a small part of the frame — see CLAUDE.md).
  google_mlkit_pose_detection: ^0.14.0
  # Global leaderboard backend. Credentials come from --dart-define at build
  # time; with none set the app runs fully offline and the global board shows
  # its locked state, so CI and local runs need no secrets.
  supabase_flutter: ^2.8.0
  # In-app purchases via RevenueCat, same pattern as PodRadar. The API key
  # comes from --dart-define; with none set the app treats every athlete as
  # unsubscribed and the paywall says purchases are unavailable, so CI, tests
  # and the web preview stay secret-free and never touch StoreKit.
  purchases_flutter: ^8.4.0
  # Opens the Privacy Policy and Terms links on the paywall. App Review taps
  # those links and expects a real page, so showing the URL for copying is not
  # enough — this is a submission requirement, not a nicety.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates every icon size from one source image. A dev dependency because
  # it runs at build time in CI, never in the app.
  flutter_launcher_icons: ^0.14.1

# ios/ and android/ are gitignored and regenerated by `flutter create` in CI,
# so the generated icon sets cannot be committed. CI runs this config right
# after scaffolding instead — see the "Generate app icons" step in
# .github/workflows/ci.yml and ios-release.yml.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  # iOS rejects an icon with an alpha channel. The source is opaque black
  # already, but flattening here means a future source with transparency
  # fails loudly at generation rather than silently at upload.
  remove_alpha_ios: true
  android: true
  # The mark is orange on black, so the adaptive-icon background is the same
  # black rather than white — a white plate would frame it like a sticker.
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    # Start/end demonstration frames per exercise. Flutter only bundles
    # files directly inside a listed directory, never its subfolders, so
    # every drill folder has to be named here.
    # Provenance and the licensing caveat: docs/exercise-media.md
    - assets/exercises/alternating_bounds/
    - assets/exercises/bounds/
    - assets/exercises/box_jumps/
    - assets/exercises/box_step_ups/
    - assets/exercises/broad_jumps/
    - assets/exercises/bulgarian_split_squat_jumps/
    - assets/exercises/calf_raises/
    - assets/exercises/depth_jumps/
    - assets/exercises/lateral_bounds/
    - assets/exercises/nordic_hamstring_curls/
    - assets/exercises/pogo_hops/
    - assets/exercises/reverse_lunges/
    - assets/exercises/single_leg_glute_bridges/
    - assets/exercises/single_leg_hops/
    - assets/exercises/split_squat_jumps/
    - assets/exercises/squat_jumps/
    - assets/exercises/tuck_jumps/
    - assets/exercises/weighted_box_jumps/
    - assets/exercises/weighted_squat_jumps/
