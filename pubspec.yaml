name: dunkmax
description: "DunkMax — a vertical jump & dunk training coach."
publish_to: "none"

# Version is Marketing+Build. CI overrides the build number with the run number.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  image: ^4.3.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  # On-device pose detection: tracks the athlete's body landmarks so takeoff
  # and landing come from where the feet actually are, not from whole-frame
  # pixel change (which is scale-invariant and so blind to a subject that
  # occupies a small part of the frame — see CLAUDE.md).
  google_mlkit_pose_detection: ^0.14.0
  # Global leaderboard backend. Credentials come from --dart-define at build
  # time; with none set the app runs fully offline and the global board shows
  # its locked state, so CI and local runs need no secrets.
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
